[project]
name = "domain-ingestion-engine"
version = "1.0.0"
description = "Convert any document corpus into adversarial RAG evaluation datasets — in under one hour, for under five dollars."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "RAG-Adversarial-Bench Contributors" },
]

keywords = ["rag", "evaluation", "benchmark", "adversarial", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "anthropic>=0.40.0",
    "pypdf>=3.0.0",
]

[project.urls]
Repository = "https://github.com/rag-adversarial-bench/domain-ingestion-engine"
# Paper URL will be added here upon arXiv publication.

[project.optional-dependencies]
# For loading HuggingFace datasets (ingest_from_hf)
hf = ["datasets>=2.0.0"]
# For OpenAI-compatible endpoints (non-Anthropic, non-Azure Foundry)
openai-compat = ["requests>=2.28.0"]
# Everything
all = ["datasets>=2.0.0", "requests>=2.28.0"]

[project.scripts]
domain-ingestion-engine = "domain_ingestion_engine.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "datasets>=2.0.0",
    "requests>=2.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=domain_ingestion_engine --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["domain_ingestion_engine"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
